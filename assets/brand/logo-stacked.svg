<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 260" role="img" aria-label="RENTTI">
  <!-- Stacked mark: navy buildings + teal roof + coral pin + coral wordmark -->
  <g transform="translate(40,18)">
    <!-- Teal roof -->
    <path d="M8 62 L80 8 L152 62 Z" fill="#2aa8a0"/>
    <rect x="128" y="18" width="14" height="22" fill="#2aa8a0"/>
    <!-- Navy buildings -->
    <path d="M18 62 L18 150 L54 150 L54 70 Z" fill="#1a2a4a"/>
    <path d="M54 54 L54 150 L106 150 L106 48 Z" fill="#1a2a4a"/>
    <path d="M106 66 L106 150 L148 150 L148 74 Z" fill="#1a2a4a"/>
    <!-- Windows -->
    <g fill="#fff">
      <rect x="28" y="88" width="14" height="14" rx="1"/>
      <rect x="72" y="78" width="16" height="16" rx="1"/>
      <rect x="118" y="92" width="14" height="14" rx="1"/>
    </g>
    <!-- Coral pin -->
    <path d="M148 78c-14 0-25 11-25 25 0 18 25 44 25 44s25-26 25-44c0-14-11-25-25-25z" fill="#ff5a3d"/>
    <circle cx="148" cy="103" r="8" fill="#fff"/>
  </g>
  <text x="120" y="222" text-anchor="middle" fill="#ff5a3d"
        font-family="Sora, 'Plus Jakarta Sans', system-ui, sans-serif"
        font-weight="700" font-size="42" letter-spacing="0.14em">RENTTI</text>
</svg>
